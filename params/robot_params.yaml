actuator:
  model: Dynamixel XL330-M288-T
  source: Rhoban BAM, bam/params/xl330/m6.json (load-dependent friction)
  bam_model: m6
  kt: 0.36601349688984386
  R: 2.8113923539223227
  error_gain: 0.0028773775022263564
  friction_base: 0.004771183165566
  friction_viscous: 0.005359668274599504
  supply_voltage: 7.4
  firmware_kp: 200
  firmware_current_limit: 1.75
  stiffness: 0.5544140148169708
  damping: 0.019155733865068244
  damping_backemf: 0.047651079266338915
  damping_scale: 0.402
  saturation_effort: 0.9634015946604082
  effort_limit: 0.6405236195572268
  velocity_limit: 20.217833667011245
  armature: 0.0018077432831600838
  friction: 0.004771183165566
  dynamic_friction: 0.004771183165566
  viscous_friction: 0.005359668274599504
  load_friction_motor: 0.2667860954283698
  friction_stribeck: 0.004676345799486616
  load_friction_external_stribeck: 0.08077928978935671
  load_friction_external_quad: 0.004902565732332559
  dtheta_stribeck: 2.890372094130307
  alpha: 8.683259907618984
  net_effort_at_current_limit: 0.4211747207045922
  datasheet_stall_torque_5v: 0.52
  datasheet_no_load_speed_5v: 8.48
  note: the gearbox eats load_friction_motor (27%) of whatever the motor produces,
    so the torque that reaches the joint at the current limit is net_effort_at_current_limit,
    not effort_limit. stiffness, stall torque, and no-load speed scale with supply_voltage;
    the current-limited effort does not. stiffness also scales with firmware_kp. Rhoban Microban
    uses kp=125 for RL walking on a biped; this quadruped carries static load on all
    four legs, where kp=125 would let the knees sag ~36 deg. Hardware load sweeps
    first selected 600; firmware_kp is now 200, which is what the robot runs and what
    the exported hardware map carries.
